# ==============================================================================
# QNX Real-Time Safety & Automation Orchestrator Configuration
# ==============================================================================

[Network]
input_node_ip = 10.61.30.52
input_node_port = 9001
output_node_ip = 10.61.30.60
output_node_port = 9002
backend_sync_port = 8000

[SafetyThresholds]
# Temperature limits (Celsius)
temp_warning_celsius = 35.0
temp_critical_celsius = 50.0

# MQ-2 Gas sensor raw 12-bit ADC limits (0 - 4095)
mq2_raw_warning_threshold = 1000
mq2_raw_critical_threshold = 1800

# Flame sensor IR ADC threshold (lower ADC value = closer/stronger flame)
flame_adc_threshold = 1000

# Communication fail-safe timeout limit in milliseconds
comm_timeout_ms = 1000

[RealTimeParameters]
thread_priority = 25
scheduling_policy = SCHED_FIFO
cycle_period_ms = 10
log_file = qnx_safety_events.log
